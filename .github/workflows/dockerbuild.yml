name: DockerBuild

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.build-and-push.outputs.digest }}

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.2.4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign published Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}


  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5

    concurrency:
      group: hardwatchbot-production
      cancel-in-progress: false

    steps:
      - name: Deploy to server
        env:
          SSH_KEY: ${{ secrets.SSH_KEY_DEPLOYER }}
          SSH_HOST: ${{ secrets.HOST_IP_MSKHUB }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}

        run: |
          IMAGE="${IMAGE,,}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -T 10 -p 21022 -H "$SSH_HOST" >> ~/.ssh/known_hosts

          echo "$GHCR_TOKEN" | ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -p 21022 \
            deployer@"$SSH_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -p 21022 \
            deployer@"$SSH_HOST" \
            "IMAGE='$IMAGE' bash -s" <<'EOF'
              set -e

              docker pull "$IMAGE"

              docker rm -f hardwatchbot 2>/dev/null || true

              docker run \
                -d \
                --name hardwatchbot \
                --network host \
                --restart unless-stopped \
                --env-file /etc/hardwatchbot/bot.env \
                --mount type=bind,readonly,src=/etc/hardwatchbot/bot_token,dst=/run/secrets/bot_token \
                "$IMAGE"
          EOF
